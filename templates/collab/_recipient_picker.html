<div class="recipient-picker position-relative" data-target="{{ target }}" data-initial="{{ initial|default:'' }}">
    <div class="picker-box form-control d-flex flex-wrap align-items-center gap-1">
        <span class="picker-chips d-inline-flex flex-wrap gap-1"></span>
        <input type="text" class="picker-search border-0 flex-grow-1" style="outline:none;min-width:120px;" placeholder="Name ya designation se search karein…" autocomplete="off">
    </div>
    <div class="picker-results list-group shadow"></div>
</div>
