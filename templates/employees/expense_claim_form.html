{% extends "base.html" %}
{% block title %}New Expense Claim - CoreCloud{% endblock %}
{% block page_title %}<i class="fas fa-receipt me-2"></i>New Expense Claim{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow">
            <div class="card-header py-3"><h6 class="m-0 fw-bold text-primary">Reimbursement details</h6></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Category</label><input name="category" class="form-control" placeholder="Travel, meals, equipment..." maxlength="100" required></div>
                        <div class="col-md-6"><label class="form-label">Amount (PKR)</label><input name="amount" type="number" step="0.01" min="0.01" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">Expense date</label><input name="expense_date" type="date" value="{{ today }}" class="form-control" required></div>
                        <div class="col-12"><label class="form-label">Description</label><textarea name="description" rows="4" class="form-control" maxlength="4000" required placeholder="Explain the business purpose and details"></textarea></div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <a href="{% url 'expense_claim_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button class="btn btn-primary"><i class="fas fa-paper-plane me-1"></i>Submit for review</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
