{% extends "base.html" %}
{% block title %}Overtime Request{% endblock %}
{% block page_title %}<i class="fas fa-clock me-2"></i>Submit Overtime Request{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow">
            <div class="card-header py-3">
                <h6 class="m-0 fw-bold text-primary"><i class="fas fa-file-alt me-1"></i> Overtime Details</h6>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Date <span class="text-danger">*</span></label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Hours <span class="text-danger">*</span></label>
                        <input type="number" name="hours" class="form-control" step="0.25" min="0.25" max="24" placeholder="e.g. 2.5" required>
                        <small class="text-muted">Enter overtime hours in quarter-hour increments.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Rate Multiplier</label>
                        <select name="rate_multiplier" class="form-select">
                            <option value="1.0">1.0x (Regular)</option>
                            <option value="1.5" selected>1.5x (Standard OT)</option>
                            <option value="2.0">2.0x (Holiday/Weekend)</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Reason <span class="text-danger">*</span></label>
                        <textarea name="reason" class="form-control" rows="3" placeholder="Reason for overtime work..." required></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'overtime_list' %}" class="btn btn-secondary"><i class="fas fa-arrow-left me-1"></i> Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane me-1"></i> Submit Request</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
